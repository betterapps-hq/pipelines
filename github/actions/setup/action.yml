name: Set up the workspace
description: >-
  Checks out the repository, installs Node from .nvmrc and the workspace's package manager (Vite+ or pnpm), and installs
  its dependencies from the lockfile, with caches.

inputs:
  checkout:
    description: Check out the repository first. Turn it off when the job has already checked out what it needs.
    default: "true"
  ref:
    description: The commit, branch or tag to check out. Empty checks out the commit that started the run.
    default: ""
  fetch-depth:
    description: Commits of history to fetch; 0 fetches all of it, which Beachball's checks need.
    default: "1"
  checkout-action:
    description: >-
      What checks out: actions for actions/checkout, blacksmith for useblacksmith/checkout, which keeps the repository
      on a Blacksmith runner's disk between runs, or auto, which picks blacksmith on a Blacksmith runner and actions
      everywhere else.
    default: auto
  working-directory:
    description: The workspace's root, relative to the repository's.
    default: .
  toolchain:
    description: >-
      vite-plus, pnpm, or auto, which picks Vite+ when the workspace's package.json or pnpm-workspace.yaml names
      vite-plus.
    default: auto
  install:
    description: Install the workspace's dependencies from its lockfile.
    default: "true"
  lfs:
    description: Fetch the repository's Git LFS objects after checking out, cached until they change.
    default: "false"
  token:
    description: The token Git LFS fetches objects with, which a private repository needs. Only that command gets it.
    default: ${{ github.token }}

outputs:
  toolchain:
    description: The toolchain that was set up, vite-plus or pnpm.
    value: ${{ steps.toolchain.outputs.toolchain }}
  checkout-action:
    description: The action that checked out, actions or blacksmith, or empty when setup didn't check out.
    value: ${{ steps.checkout.outputs.action }}

runs:
  using: composite
  steps:
    # Blacksmith's runners set BLACKSMITH_VM_ID, which is what its checkout looks for too. It isn't in the env context,
    # so a shell step reads it.
    - if: inputs.checkout == 'true'
      id: checkout
      shell: bash
      env:
        CHECKOUT_ACTION: ${{ inputs.checkout-action }}
      run: |
        if [ "$CHECKOUT_ACTION" = auto ]; then
          if [ -n "${BLACKSMITH_VM_ID:-}" ]; then CHECKOUT_ACTION=blacksmith; else CHECKOUT_ACTION=actions; fi
        fi
        case "$CHECKOUT_ACTION" in
          actions | blacksmith) echo "action=$CHECKOUT_ACTION" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::checkout-action is actions, blacksmith or auto, not '$CHECKOUT_ACTION'." && exit 1 ;;
        esac
    # Windows runners turn LF into CRLF on checkout, which formatters then report on every file. A repository's
    # .gitattributes wins over this either way.
    - if: inputs.checkout == 'true' && runner.os == 'Windows'
      shell: bash
      run: git config --global core.autocrlf false
    - if: steps.checkout.outputs.action == 'actions'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false
    # Blacksmith's fork of actions/checkout, with the same inputs. On a Blacksmith runner it fetches through a mirror of
    # the repository kept on the runner's disk and refreshes it after the job; anywhere else it checks out as
    # actions/checkout does. Caches need nothing of Blacksmith's: its runners serve actions/cache's from their own.
    - if: steps.checkout.outputs.action == 'blacksmith'
      uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: false

    # LFS objects are cached by the list of them and the fetch filters, so they're downloaded only when one changes.
    # Git hashes them, since every system has it. The cache is where Git LFS keeps its objects, which it reports, and
    # its filters are set up in the checkout so the pull replaces the pointers.
    - if: inputs.lfs == 'true'
      id: lfs
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        git lfs install --local
        hash=$({
          git lfs ls-files --long | cut -d ' ' -f1 | sort
          git config --get-all lfs.fetchinclude || true
          git config --get-all lfs.fetchexclude || true
        } | git hash-object --stdin)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "path=$(git lfs env | sed -n 's/^LocalMediaDir=//p')" >> "$GITHUB_OUTPUT"
    - if: inputs.lfs == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.lfs.outputs.path }}
        key: lfs-${{ runner.os }}-${{ steps.lfs.outputs.hash }}
        restore-keys: lfs-${{ runner.os }}-
    # setup's checkout keeps no credentials, so the pull is given the token for itself alone, as a header no later step
    # sees. A checkout of the caller's own that kept them already has a header, and a second would be refused.
    - if: inputs.lfs == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOKEN: ${{ inputs.token }}
        SERVER: ${{ github.server_url }}
      run: |
        if git config --get-regexp '^(http\..*\.extraheader|includeif\..*)$' > /dev/null; then
          git lfs pull
          exit
        fi
        basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
        echo "::add-mask::$basic"
        git -c "http.$SERVER/.extraheader=AUTHORIZATION: basic $basic" lfs pull

    - id: toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        if [ "$TOOLCHAIN" = auto ]; then
          if grep -qs '"vite-plus"' package.json || grep -qs '^ *vite-plus:' pnpm-workspace.yaml; then
            TOOLCHAIN=vite-plus
          else
            TOOLCHAIN=pnpm
          fi
        fi
        case "$TOOLCHAIN" in
          vite-plus | pnpm) echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::toolchain is vite-plus, pnpm or auto, not '$TOOLCHAIN'." && exit 1 ;;
        esac

    # Vite+ installs Node and the package manager itself, and caches the dependencies. Its relative paths are the
    # working directory's, and its install is frozen on CI.
    - if: steps.toolchain.outputs.toolchain == 'vite-plus'
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        working-directory: ${{ inputs.working-directory }}
        node-version-file: .nvmrc
        cache: ${{ inputs.install }}
        run-install: ${{ inputs.install }}

    # pnpm comes first, so setup-node can find its store to cache. Its version is package.json's packageManager.
    - if: steps.toolchain.outputs.toolchain == 'pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
    - if: steps.toolchain.outputs.toolchain == 'pnpm'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.working-directory }}/.nvmrc
        # A job that doesn't install has no store to restore or save, and setup-node mustn't guess a cache of its own.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}
        package-manager-cache: false
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - if: steps.toolchain.outputs.toolchain == 'pnpm' && inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
