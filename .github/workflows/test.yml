name: Test

# Tests the templates against the example workspaces. The setup action is tested from this commit; ci-verify is called
# from this commit too, but uses the setup action at the release it names.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # Tests pass is the one check main requires, so a job it doesn't wait on could fail and still merge.
      - name: Check Tests pass waits on every job
        run: |
          diff <(yq '.jobs | keys | .[]' .github/workflows/test.yml | grep -vx tests-pass | sort)             <(yq '.jobs["tests-pass"].needs[]' .github/workflows/test.yml | sort)

  setup:
    name: setup (${{ matrix.example }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [pnpm, vite-plus]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./github/actions/setup
        with:
          checkout: "false"
          working-directory: examples/${{ matrix.example }}
      - name: Check it picked the example's toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.setup.outputs.toolchain }}
          EXAMPLE: ${{ matrix.example }}
        run: test "$TOOLCHAIN" = "$EXAMPLE"
      - shell: bash
        working-directory: examples/${{ matrix.example }}
        run: pnpm verify

  ci-verify:
    name: ci-verify (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        example: [pnpm, vite-plus]
    uses: ./.github/workflows/ci-verify.yml
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      working-directory: examples/${{ matrix.example }}
      prepare: echo prepared > prepared.txt
      cache-path: examples/${{ matrix.example }}/prepared.txt
      cache-key-files: examples/${{ matrix.example }}/package.json
      command: test -f prepared.txt && pnpm verify

  # Nothing here is set up to publish to, so these check the templates skip with a notice rather than fail. The test
  # environment exists only for that.
  publish-storybook:
    name: publish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/publish-storybook.yml
    with:
      environment: storybook-test
      working-directory: examples/pnpm

  publish-storybook-skipped:
    name: Check publish-storybook skipped
    needs: publish-storybook
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ needs.publish-storybook.outputs.url }}
        run: test -z "$URL"

  unpublish-storybook:
    name: unpublish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/unpublish-storybook.yml
    with:
      environment: storybook-test
      preview-name: pr-0

  # The release templates against the release example: its change files bump three packages, and its packages are ones
  # each publishing rule keeps or leaves out. Dry runs push and publish nothing, so they need no token.
  release-prepare:
    name: release-prepare (dry run)
    uses: ./.github/workflows/release-prepare.yml
    with:
      working-directory: examples/release
      dry-run: true

  # GitHub checks a reusable workflow's permissions before the run starts, so these grant id-token: write, though a dry
  # run never uses it.
  cd-npm-publish:
    name: cd-npm-publish (dry run, publishConfig required)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-npm-publish.yml
    with:
      working-directory: examples/release
      require-publish-config: true
      dry-run: true

  cd-npm-publish-public:
    name: cd-npm-publish (dry run, every public package)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd-npm-publish.yml
    with:
      working-directory: examples/release
      dry-run: true

  release-checked:
    name: Check the release dry runs
    needs: [release-prepare, cd-npm-publish, cd-npm-publish-public]
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ needs.release-prepare.outputs.title }}
          BUMPED: ${{ needs.release-prepare.outputs.packages }}
          PULL_REQUEST: ${{ needs.release-prepare.outputs.pull-request }}
          WITH_CONFIG: ${{ needs.cd-npm-publish.outputs.packages }}
          PUBLIC: ${{ needs.cd-npm-publish-public.outputs.packages }}
        run: |
          set -x
          test "$TITLE" = "chore(release): @pipelines-example/app@1.0.1 and 2 more"
          test "$(jq -r 'map("\(.name)@\(.from)->\(.to)") | join(" ")' <<< "$BUMPED")" = \
            "@pipelines-example/app@1.0.0->1.0.1 @pipelines-example/cli@1.0.0->1.0.1 @pipelines-example/core@1.0.0->1.1.0"
          test -z "$PULL_REQUEST"
          # In dependency order: core before what depends on it. left-pad is left out, as npm has its version.
          test "$(jq -r 'map(.name) | join(" ")' <<< "$WITH_CONFIG")" = "@pipelines-example/core @pipelines-example/cli"
          test "$(jq -r 'map(.name) | join(" ")' <<< "$PUBLIC")" = \
            "@pipelines-example/core @pipelines-example/app @pipelines-example/cli"

  terraform:
    name: Validate the Terraform modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - working-directory: terraform/cloudflare-storybook/examples/basic
        run: terraform init -backend=false -input=false -lockfile=readonly
      - working-directory: terraform/cloudflare-storybook/examples/basic
        run: terraform validate

  # This repository's own formatting and lint, through its own template.
  verify:
    name: verify (this repository)
    uses: ./.github/workflows/ci-verify.yml

  # The one check main's ruleset requires, so adding or renaming a job never means changing the ruleset.
  tests-pass:
    name: Tests pass
    if: always()
    needs:
      - lint
      - setup
      - ci-verify
      - publish-storybook
      - publish-storybook-skipped
      - unpublish-storybook
      - release-prepare
      - cd-npm-publish
      - cd-npm-publish-public
      - release-checked
      - terraform
      - verify
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every test passed."
