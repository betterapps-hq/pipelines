name: Test

# Tests the templates against the example workspaces. The actions are tested from this commit; the reusable workflows
# are called from this commit too, but use the actions at the release they name.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # Tests pass is the one check main requires, so a job it doesn't wait on could fail and still merge.
      - name: Check Tests pass waits on every job
        run: |
          diff <(yq '.jobs | keys | .[]' .github/workflows/test.yml | grep -vx tests-pass | sort)             <(yq '.jobs["tests-pass"].needs[]' .github/workflows/test.yml | sort)
      - name: Check Terraform enablement comes from the selected environment
        shell: bash
        run: |
          script=$(yq '.jobs.apply.steps[] | select(.id == "ready") | .run' .github/workflows/terraform-apply.yml)
          gh() {
            test "$1" = api &&
              test "$2" = repos/example/repository/environments/test%2Froom%20space/variables/TF_APPLY_ENABLED || return 1
            if [ "$TEST_MARKER" = missing ]; then return 1; fi
            printf '%s\n' "$TEST_MARKER"
          }
          run_gate() { eval "$script"; }
          for marker in true false missing; do
            output=$(mktemp)
            # Simulate a broader scope enabling applies; only the environment API result may enable this job.
            TEST_MARKER="$marker" HAS_STATE_CREDENTIALS=true GH_TOKEN=unused APPLY_ENABLED=true ENVIRONMENT='test/room space' \
              GITHUB_REPOSITORY=example/repository GITHUB_OUTPUT="$output" run_gate
            if [ "$marker" = true ]; then
              grep -qx 'ready=true' "$output"
            else
              grep -qx 'result=skipped' "$output"
            fi
            rm "$output"
          done

  setup:
    name: setup (${{ matrix.example }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [pnpm, vite-plus]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./github/actions/setup
        with:
          checkout: "false"
          working-directory: examples/${{ matrix.example }}
          # This repository has no LFS objects, so this proves the steps run cleanly on every system.
          lfs: "true"
      - name: Check it picked the example's toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.setup.outputs.toolchain }}
          EXAMPLE: ${{ matrix.example }}
        run: test "$TOOLCHAIN" = "$EXAMPLE"
      - shell: bash
        working-directory: examples/${{ matrix.example }}
        run: pnpm verify

  # setup's own checkout, with each checkout action, over the checkout that brought the action. These are GitHub's
  # runners, so auto has to pick actions/checkout, and Blacksmith's checks out as actions/checkout does: its mirror is
  # used only on Blacksmith's runners, which this repository doesn't have.
  setup-checkout:
    name: setup checkout (${{ matrix.checkout-action }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        checkout-action: [auto, actions, blacksmith]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pull request's head rather than the merge commit the run starts from, so it's only checked out if ref arrives.
      - id: setup
        uses: ./github/actions/setup
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: "2"
          checkout-action: ${{ matrix.checkout-action }}
          # Only Blacksmith's checkout takes it, and only uses it on Blacksmith's runners.
          dissociate: ${{ matrix.checkout-action == 'blacksmith' }}
          working-directory: examples/pnpm
          install: "false"
          # The LFS pull needs a token of its own when the checkout kept none.
          lfs: "true"
      - name: Check which action checked out
        env:
          ACTION: ${{ steps.setup.outputs.checkout-action }}
          EXPECTED: ${{ matrix.checkout-action == 'auto' && 'actions' || matrix.checkout-action }}
        run: test "$ACTION" = "$EXPECTED"
      - name: Check the ref and depth reached the checkout
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test "$(git rev-parse --is-shallow-repository)" = true
          test "$(git rev-list --first-parent --count HEAD)" = 2
      - name: Check the checkout kept no credentials
        run: |
          if git config --get-regexp '^(http\..*\.extraheader|includeif\..*)$'; then exit 1; fi
      - name: Check Windows keeps LF
        if: runner.os == 'Windows'
        run: test "$(git config --global core.autocrlf)" = false
      - name: Set up with an unknown checkout action
        id: unknown
        if: matrix.checkout-action == 'auto' && runner.os == 'Linux'
        continue-on-error: true
        uses: ./github/actions/setup
        with:
          checkout-action: github
          working-directory: examples/pnpm
          install: "false"
      - name: Check an unknown checkout action fails
        if: steps.unknown.conclusion == 'success'
        env:
          OUTCOME: ${{ steps.unknown.outcome }}
        run: test "$OUTCOME" = failure
      # As on a Blacksmith runner, where auto has to pick Blacksmith's checkout. Only the choice is checked: without
      # Blacksmith's agent its checkout falls back to a plain one, but this isn't the runner it's meant for.
      - name: Set up as on a Blacksmith runner
        id: blacksmith
        if: matrix.checkout-action == 'auto' && runner.os == 'Linux'
        continue-on-error: true
        uses: ./github/actions/setup
        env:
          BLACKSMITH_VM_ID: test
        with:
          working-directory: examples/pnpm
          install: "false"
      - name: Check auto picked Blacksmith's checkout
        if: always() && steps.blacksmith.conclusion == 'success'
        env:
          ACTION: ${{ steps.blacksmith.outputs.checkout-action }}
        run: test "$ACTION" = blacksmith

  ci-verify:
    name: ci-verify (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: pnpm
            verify: pnpm verify
          # Verified through the task cache, so there's a cache to save, and again to show in the log what it replays.
          - example: vite-plus
            verify: vp run --cache verify && test -n "$(ls -A node_modules/.vite/task-cache)" && vp run --cache verify
    uses: ./.github/workflows/ci-verify.yml
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      working-directory: examples/${{ matrix.example }}
      env: |
        EXAMPLE_ENV=reached the install and every step
      node-options: --max-old-space-size=4096
      concurrency-key: test-${{ github.ref }}
      # As setup's own test, this repository has no LFS objects, so it proves the input reaches setup cleanly.
      lfs: true
      vite-task-cache: ${{ matrix.example == 'vite-plus' }}
      prepare: echo prepared > prepared.txt
      cache-path: examples/${{ matrix.example }}/prepared.txt
      cache-key-files: examples/${{ matrix.example }}/package.json
      command: |
        test "$EXAMPLE_ENV" = "reached the install and every step"
        test "$NODE_OPTIONS" = --max-old-space-size=4096
        test -f prepared.txt
        ${{ matrix.verify }}

  # A build handed to a later job: each runner builds, and only artifact-os uploads, though it's listed second. Each
  # build says where it ran, so the job after it shows the artifact is ubuntu's, whole, under the name the output gives.
  ci-verify-artifact:
    name: ci-verify (artifact)
    uses: ./.github/workflows/ci-verify.yml
    with:
      os: '["windows-latest", "ubuntu-latest"]'
      working-directory: examples/pnpm
      concurrency-key: test-artifact-${{ github.ref }}
      command: |
        pnpm verify
        mkdir -p dist/assets
        echo "$RUNNER_OS" > dist/assets/built-on.txt
      artifact-path: examples/pnpm/dist
      artifact-name: test-build
      artifact-os: ubuntu-latest
      artifact-retention-days: 1

  ci-verify-artifact-downloaded:
    name: Check ci-verify's artifact downloads
    needs: ci-verify-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check the output names the artifact
        env:
          NAME: ${{ needs.ci-verify-artifact.outputs.artifact-name }}
        run: test "$NAME" = test-build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.ci-verify-artifact.outputs.artifact-name }}
          path: examples/pnpm/dist
      - name: Check it's the build from ubuntu
        run: test "$(cat examples/pnpm/dist/assets/built-on.txt)" = Linux

  # The vite-task-cache action from this commit, with the Vite+ example's tasks, on each system. This job runs them twice
  # and the second time has to replay both, which shows they're tracked stably there, Windows included. Its cache is
  # saved at the end, and the next job restores it on a fresh runner, where both have to replay again.
  vite-task-cache:
    name: vite-task-cache (save, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: examples/vite-plus
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./github/actions/setup
        with:
          checkout: "false"
          working-directory: examples/vite-plus
      - id: cache
        uses: ./github/actions/vite-task-cache
        with:
          working-directory: examples/vite-plus
          key: test
      - name: Check the key
        env:
          KEY: ${{ steps.cache.outputs.key }}
          EXPECTED:
            vite-task-${{ runner.os }}-${{ runner.arch }}-[examples/vite-plus]-[test]-${{ github.run_id }}-${{
            github.run_attempt }}
        run: test "$KEY" = "$EXPECTED"
      - run: vp run verify
      # The log goes outside the workspace, since a new file in it would change what the tasks list.
      - name: Check both tasks replay
        run: vp run verify | tee "$RUNNER_TEMP/verify.log" && grep -q "2/2 cache hit" "$RUNNER_TEMP/verify.log"

  vite-task-cache-restore:
    name: vite-task-cache (restore, ${{ matrix.os }})
    needs: vite-task-cache
    # A fork's pull request can restore but not save, so on its first run there's nothing for this job to find.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: examples/vite-plus
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./github/actions/setup
        with:
          checkout: "false"
          working-directory: examples/vite-plus
      # The same key as the job before, so it restores exactly what that job saved, unless only this job is re-run.
      - id: cache
        uses: ./github/actions/vite-task-cache
        with:
          working-directory: examples/vite-plus
          key: test
      # On a run's first attempt it has to be the cache the save job just made, not an older one restore-keys found. A
      # re-run of only this job has a new attempt in its key, so there it can only be an older one.
      - name: Check it restored the cache the save job made
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          test "$RESTORED" = true
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then test "$CACHE_HIT" = true; fi
      - name: Check both tasks replay on a fresh runner
        run: vp run verify | tee "$RUNNER_TEMP/verify.log" && grep -q "2/2 cache hit" "$RUNNER_TEMP/verify.log"

  # Nothing here is set up to publish to, so these check the templates skip with a notice rather than fail. The test
  # environment exists only for that.
  publish-storybook:
    name: publish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/publish-storybook.yml
    with:
      environment: storybook-test
      working-directory: examples/pnpm

  publish-storybook-skipped:
    name: Check publish-storybook skipped
    needs: publish-storybook
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ needs.publish-storybook.outputs.url }}
        run: test -z "$URL"

  unpublish-storybook:
    name: unpublish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/unpublish-storybook.yml
    with:
      environment: storybook-test
      preview-name: pr-0

  # The release templates against the release example: its change files bump three packages, and its packages are ones
  # each publishing rule keeps or leaves out. Dry runs push and publish nothing, so they need no token.
  release-prepare:
    name: release-prepare (dry run)
    uses: ./.github/workflows/release-prepare.yml
    with:
      working-directory: examples/release
      dry-run: true

  # GitHub checks a reusable workflow's permissions before the run starts, so these grant id-token: write and
  # actions: read, though a dry run uses neither.
  cd-npm-publish:
    name: cd-npm-publish (dry run, publishConfig required)
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/cd-npm-publish.yml
    with:
      working-directory: examples/release
      require-publish-config: true
      dry-run: true

  cd-npm-publish-public:
    name: cd-npm-publish (dry run, every public package)
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/cd-npm-publish.yml
    with:
      working-directory: examples/release
      dry-run: true

  desktop-release:
    name: cd-desktop-release (dry run)
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/cd-desktop-release.yml
    with:
      working-directory: examples/desktop
      app-directory: .
      build-command: node --version
      package-command: node package.mjs
      dry-run: true

  desktop-checked:
    name: Check desktop release and promotion
    needs: desktop-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the dry-run output
        env:
          VERSION: ${{ needs.desktop-release.outputs.version }}
          PUBLISHED: ${{ needs.desktop-release.outputs.published }}
        run: |
          test "$VERSION" = 1.0.0
          test "$PUBLISHED" = false
      - name: Reject missing installers and duplicate platform filenames
        shell: bash
        run: |
          workflow="$GITHUB_WORKSPACE/.github/workflows/cd-desktop-release.yml"
          validate=$(yq '.jobs.build.steps[] | select(.id == "artifacts") | .run' "$workflow")
          collect=$(yq '.jobs.publish.steps[] | select(.id == "collect") | .run' "$workflow")
          work=$(mktemp -d)
          cd "$work"
          export GITHUB_WORKSPACE="$work" WORKING_DIRECTORY=. APP_DIRECTORY=. ARTIFACT_DIRECTORY=dist
          export GITHUB_OUTPUT="$work/output" RUNNER_PLATFORM=Windows
          mkdir dist
          touch dist/App.zip dist/latest.yml
          if bash -e -c "$validate"; then echo "Accepted a missing Windows installer"; exit 1; fi
          touch dist/App.exe
          bash -e -c "$validate"
          mkdir -p platform-artifacts/windows platform-artifacts/macos
          touch platform-artifacts/windows/App.zip platform-artifacts/macos/App.zip
          if bash -e -c "$collect"; then echo "Accepted duplicate assets"; exit 1; fi
          test ! -e installers
          mv platform-artifacts/macos/App.zip platform-artifacts/macos/App-mac.zip
          bash -e -c "$collect"
          test -f installers/App.zip
          test -f installers/App-mac.zip
      - name: Check desktop release accepts only successful CI pushes or checked manual retries
        shell: bash
        run: |
          script=$(yq '.jobs.select.steps[] | select(.id == "ready") | .run' .github/workflows/cd-desktop-release.yml)
          export DRY_RUN=false DEFAULT_BRANCH=main GITHUB_REF=refs/heads/main GITHUB_REPOSITORY=example/repository
          export GITHUB_SHA=1111111111111111111111111111111111111111 CI_SHA=2222222222222222222222222222222222222222
          export CI_EVENT=push CI_BRANCH=main CI_REPOSITORY=example/repository CI_RESULT=success
          export CI_WORKFLOW=ci.yml CI_WORKFLOW_PATH=.github/workflows/ci.yml GH_TOKEN=unused TEST_CI_COUNT=1
          gh() { test "$1" = api && echo "$TEST_CI_COUNT"; }
          export -f gh
          run_gate() {
            export GITHUB_OUTPUT
            GITHUB_OUTPUT=$(mktemp)
            bash -e -o pipefail -c "$script"
          }
          run_gate
          grep -qx "commit=$CI_SHA" "$GITHUB_OUTPUT"
          for invalid in fork pr failed branch workflow; do
            (
              case "$invalid" in
                fork) export CI_REPOSITORY=someone/fork ;;
                pr) export CI_EVENT=pull_request ;;
                failed) export CI_RESULT=failure ;;
                branch) export CI_BRANCH=feature ;;
                workflow) export CI_WORKFLOW_PATH=.github/workflows/other.yml ;;
              esac
              run_gate
              test ! -s "$GITHUB_OUTPUT"
            )
          done
          export CI_SHA=
          run_gate
          grep -qx "commit=$GITHUB_SHA" "$GITHUB_OUTPUT"
          export TEST_CI_COUNT=0
          run_gate
          test ! -s "$GITHUB_OUTPUT"
      - name: Exercise the actual promotion script with a mocked GitHub API
        shell: bash
        run: |
          script=$(yq '.jobs.promote.steps[] | select(.id == "promote") | .run' .github/workflows/cd-desktop-promote.yml)
          base=$(mktemp -d)
          export TEST_FIXTURE="$base/good" TEST_EDITS="$base/edits" TEST_COMMIT=1111111111111111111111111111111111111111
          export GITHUB_REPOSITORY=example/repository GITHUB_REF=refs/heads/main DEFAULT_BRANCH=main VERSION=1.0.0 GH_TOKEN=unused
          node --input-type=module <<'NODE'
          import {mkdirSync, writeFileSync} from "node:fs"
          import {createHash} from "node:crypto"
          const dir = process.env.TEST_FIXTURE
          mkdirSync(dir)
          const bytes = "installer fixture"
          writeFileSync(`${dir}/Example-1.0.0.exe`, bytes)
          writeFileSync(`${dir}/desktop-release.json`, JSON.stringify({schema:1, version:"1.0.0", commit:process.env.TEST_COMMIT,
            assets:[{name:"Example-1.0.0.exe", sha256:createHash("sha256").update(bytes).digest("hex")}]}))
          NODE
          gh() {
            case "$1 $2" in
              "api repos/example/repository/releases/tags/v1.0.0") printf '{"draft":false,"prerelease":%s}\n' "$TEST_PRERELEASE" ;;
              "api repos/example/repository/git/ref/tags/v1.0.0") echo "commit $TEST_COMMIT" ;;
              "api repos/example/repository/releases/latest") printf '{"tag_name":"v%s"}\n' "$TEST_LATEST" ;;
              "release download") cp -R "$TEST_FIXTURE" installers ;;
              "release edit") printf '%s\n' "$*" >> "$TEST_EDITS" ;;
              *) echo "Unexpected gh call" >&2; return 1 ;;
            esac
          }
          export -f gh
          export TEST_PRERELEASE=true TEST_LATEST=0.9.0
          run_case() {
            local work
            work=$(mktemp -d)
            export GITHUB_OUTPUT="$work/output"
            (cd "$work" && bash -e -o pipefail -c "$script")
          }
          run_case
          test "$(wc -l < "$TEST_EDITS")" = 1
          grep -q -- '--prerelease=false --latest' "$TEST_EDITS"
          export TEST_LATEST=2.0.0
          if run_case; then echo "A downgrade unexpectedly succeeded"; exit 1; fi
          export TEST_LATEST=0.9.0
          printf changed >> "$TEST_FIXTURE/Example-1.0.0.exe"
          if run_case; then echo "Changed installer unexpectedly promoted"; exit 1; fi
          export TEST_PRERELEASE=false
          run_case
          export TEST_PRERELEASE=true GITHUB_REF=refs/heads/feature
          if run_case; then echo "A feature branch unexpectedly promoted"; exit 1; fi
          test "$(wc -l < "$TEST_EDITS")" = 1

      - name: Check a missing tag creates a draft and a conflicting tag fails
        shell: bash
        run: |
          script=$(yq '.jobs.publish.steps[] | select(.id == "publish") | .run' .github/workflows/cd-desktop-release.yml)
          base=$(mktemp -d)
          export TEST_EDITS="$base/edits" COMMIT=1111111111111111111111111111111111111111
          export VERSION=1.0.0 APP_DIRECTORY=app GITHUB_REPOSITORY=example/repository GH_TOKEN=unused TEST_TAG=missing
          gh() {
            case "$1 $2" in
              "api repos/example/repository/git/ref/tags/v1.0.0")
                if [ "$TEST_TAG" = missing ]; then echo 'gh: Not Found (HTTP 404)' >&2; return 1; fi
                echo 'commit 2222222222222222222222222222222222222222' ;;
              "release view") return 1 ;;
              "release create" | "release upload" | "release edit") printf '%s\n' "$*" >> "$TEST_EDITS" ;;
              *) echo "Unexpected gh call" >&2; return 1 ;;
            esac
          }
          export -f gh
          run_case() {
            local work
            work=$(mktemp -d)
            mkdir -p "$work/source/app" "$work/installers"
            printf notes > "$work/source/app/CHANGELOG.md"
            printf fixture > "$work/installers/Example-1.0.0.exe"
            export GITHUB_OUTPUT="$work/output"
            (cd "$work" && bash -e -o pipefail -c "$script")
          }
          run_case
          grep -q '^release create v1.0.0 ' "$TEST_EDITS"
          test "$(wc -l < "$TEST_EDITS")" = 3
          export TEST_TAG=conflicting
          if run_case; then echo "A conflicting tag unexpectedly published"; exit 1; fi
          test "$(wc -l < "$TEST_EDITS")" = 3

  release-checked:
    name: Check the release dry runs
    needs: [release-prepare, cd-npm-publish, cd-npm-publish-public]
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ needs.release-prepare.outputs.title }}
          BUMPED: ${{ needs.release-prepare.outputs.packages }}
          PULL_REQUEST: ${{ needs.release-prepare.outputs.pull-request }}
          WITH_CONFIG: ${{ needs.cd-npm-publish.outputs.packages }}
          PUBLIC: ${{ needs.cd-npm-publish-public.outputs.packages }}
          PUBLISHED: ${{ needs.cd-npm-publish.outputs.published }} ${{ needs.cd-npm-publish-public.outputs.published }}
        run: |
          set -x
          test "$TITLE" = "chore(release): @pipelines-example/app@1.0.1 and 2 more"
          test "$(jq -r 'map("\(.name)@\(.from)->\(.to)") | join(" ")' <<< "$BUMPED")" = \
            "@pipelines-example/app@1.0.0->1.0.1 @pipelines-example/cli@1.0.0->1.0.1 @pipelines-example/core@1.0.0->1.1.0"
          test -z "$PULL_REQUEST"
          # In dependency order: core before what depends on it. left-pad is left out, as npm has its version, and the
          # restricted package, as provenance needs public ones.
          test "$(jq -r 'map(.name) | join(" ")' <<< "$WITH_CONFIG")" = "@pipelines-example/core @pipelines-example/cli"
          test "$(jq -r 'map(.name) | join(" ")' <<< "$PUBLIC")" = \
            "@pipelines-example/core @pipelines-example/app @pipelines-example/cli"
          test "$PUBLISHED" = "false false"

  # The web templates skip with a notice too. web-test exists only for that, and the commands fail if they run.
  preview-web:
    name: preview-web (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview-web.yml
    with:
      environment: web-test
      preview-name: pr-0
      working-directory: examples/pnpm
      neon: true
      build-command: exit 1
      migrate-command: exit 1
      deploy-command: exit 1

  preview-web-skipped:
    name: Check preview-web skipped
    needs: preview-web
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ needs.preview-web.outputs.url }}
          NEON_BRANCH: ${{ needs.preview-web.outputs.neon-branch-id }}
        run: test -z "$URL$NEON_BRANCH"

  preview-web-cleanup:
    name: preview-web-cleanup (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/preview-web-cleanup.yml
    with:
      environment: web-test
      preview-name: pr-0
      neon: true
      delete-command: exit 1

  cd-web-deploy:
    name: cd-web-deploy (no environment settings)
    uses: ./.github/workflows/cd-web-deploy.yml
    with:
      environment: web-test
      working-directory: examples/pnpm
      build-command: exit 1
      migrate-command: exit 1

  # After cd-web-deploy, so web-test has a deployment that skipped, which mustn't count as something to promote.
  cd-web-promote:
    name: cd-web-promote (nothing deployed)
    needs: cd-web-deploy
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/cd-web-promote.yml
    with:
      environment: web-test
      from-environment: web-test
      working-directory: examples/pnpm
      build-command: exit 1

  cd-web-skipped:
    name: Check cd-web-deploy and cd-web-promote skipped
    needs: [cd-web-deploy, cd-web-promote]
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOYED: ${{ needs.cd-web-deploy.outputs.url }}${{ needs.cd-web-deploy.outputs.commit }}
          PROMOTED: ${{ needs.cd-web-promote.outputs.commit }}${{ needs.cd-web-promote.outputs.url }}
        run: test -z "$DEPLOYED$PROMOTED"

  # The comment action from this commit, looking for a comment no run writes and, told not to create one, leaving it so.
  pr-comment:
    name: pr-comment (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: comment
        uses: ./github/actions/pr-comment
        with:
          marker: "<!-- pipelines test ${{ github.run_id }} -->"
          body: Never written.
          create: "false"
      - shell: bash
        env:
          ID: ${{ steps.comment.outputs.comment-id }}
        run: test -z "$ID"

  terraform:
    name: Validate the Terraform modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      # Every module has an examples/basic, a root project with a lockfile, which validates without credentials.
      - name: Validate each module's example
        shell: bash
        run: |
          for example in terraform/*/examples/basic; do
            echo "::group::$example"
            terraform -chdir="$example" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$example" validate
            echo "::endgroup::"
          done

  # Nothing here has Terraform state to plan against, so these check the templates skip planning and applying with a
  # notice rather than fail. The plan still checks the example's formatting and validates it. The test environment
  # exists only for that.
  terraform-plan:
    name: terraform-plan (no credentials)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/terraform-plan.yml
    with:
      working-directory: terraform/github-repository-rules/examples/basic
      fmt-path: ../..
      state-bucket: example-terraform-state
      state-endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com

  terraform-plan-skipped:
    name: Check terraform-plan skipped
    needs: terraform-plan
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.terraform-plan.outputs.result }}
        run: test "$RESULT" = skipped

  terraform-apply:
    name: terraform-apply (no environment settings)
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: terraform-test
      working-directory: terraform/github-repository-rules/examples/basic
      state-bucket: example-terraform-state
      state-endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com

  terraform-apply-skipped:
    name: Check terraform-apply skipped
    needs: terraform-apply
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.terraform-apply.outputs.result }}
        run: test "$RESULT" = skipped

  # Forwarded credentials alone must not enable an environment that hasn't been provisioned by an administrator.
  terraform-apply-unconfigured:
    name: terraform-apply (forwarded credentials, unconfigured environment)
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: terraform-test-unconfigured
      working-directory: terraform/github-repository-rules/examples/basic
      state-bucket: example-terraform-state
      state-endpoint: https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com
    secrets:
      TF_STATE_ACCESS_KEY_ID: test-key-never-used
      TF_STATE_SECRET_ACCESS_KEY: test-secret-never-used

  terraform-apply-unconfigured-skipped:
    name: Check unconfigured terraform-apply skipped
    needs: terraform-apply-unconfigured
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.terraform-apply-unconfigured.outputs.result }}
        run: test "$RESULT" = skipped

  # This repository's own formatting and lint, through its own template.
  verify:
    name: verify (this repository)
    uses: ./.github/workflows/ci-verify.yml

  # The one check main's ruleset requires, so adding or renaming a job never means changing the ruleset.
  tests-pass:
    name: Tests pass
    if: always()
    needs:
      - lint
      - setup
      - setup-checkout
      - ci-verify
      - ci-verify-artifact
      - ci-verify-artifact-downloaded
      - vite-task-cache
      - vite-task-cache-restore
      - publish-storybook
      - publish-storybook-skipped
      - unpublish-storybook
      - release-prepare
      - cd-npm-publish
      - cd-npm-publish-public
      - desktop-release
      - desktop-checked
      - release-checked
      - preview-web
      - preview-web-skipped
      - preview-web-cleanup
      - cd-web-deploy
      - cd-web-promote
      - cd-web-skipped
      - pr-comment
      - terraform
      - terraform-plan
      - terraform-plan-skipped
      - terraform-apply
      - terraform-apply-skipped
      - terraform-apply-unconfigured
      - terraform-apply-unconfigured-skipped
      - verify
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every test passed."
