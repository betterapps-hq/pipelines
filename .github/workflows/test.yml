name: Test

# Tests the templates against the example workspaces. The setup action is tested from this commit; ci-verify is called
# from this commit too, but uses the setup action at the release it names.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint the workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      # Tests pass is the one check main requires, so a job it doesn't wait on could fail and still merge.
      - name: Check Tests pass waits on every job
        run: |
          diff <(yq '.jobs | keys | .[]' .github/workflows/test.yml | grep -vx tests-pass | sort)             <(yq '.jobs["tests-pass"].needs[]' .github/workflows/test.yml | sort)

  setup:
    name: setup (${{ matrix.example }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        example: [pnpm, vite-plus]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./github/actions/setup
        with:
          checkout: "false"
          working-directory: examples/${{ matrix.example }}
          # This repository has no LFS objects, so this proves the steps run cleanly on every system.
          lfs: "true"
      - name: Check it picked the example's toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.setup.outputs.toolchain }}
          EXAMPLE: ${{ matrix.example }}
        run: test "$TOOLCHAIN" = "$EXAMPLE"
      - shell: bash
        working-directory: examples/${{ matrix.example }}
        run: pnpm verify

  ci-verify:
    name: ci-verify (${{ matrix.example }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: pnpm
            verify: pnpm verify
          # Verifying through vp run leaves a task cache for the template to save.
          - example: vite-plus
            verify: vp run verify && test -d node_modules/.vite/task-cache
    uses: ./.github/workflows/ci-verify.yml
    with:
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      working-directory: examples/${{ matrix.example }}
      env: |
        EXAMPLE_ENV=reached the install and every step
      node-options: --max-old-space-size=4096
      concurrency-key: test-${{ github.ref }}
      vite-task-cache: ${{ matrix.example == 'vite-plus' }}
      prepare: echo prepared > prepared.txt
      cache-path: examples/${{ matrix.example }}/prepared.txt
      cache-key-files: examples/${{ matrix.example }}/package.json
      command: |
        test "$EXAMPLE_ENV" = "reached the install and every step"
        test "$NODE_OPTIONS" = --max-old-space-size=4096
        test -f prepared.txt
        ${{ matrix.verify }}

  # Nothing here is set up to publish to, so these check the templates skip with a notice rather than fail. The test
  # environment exists only for that.
  publish-storybook:
    name: publish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/publish-storybook.yml
    with:
      environment: storybook-test
      working-directory: examples/pnpm

  publish-storybook-skipped:
    name: Check publish-storybook skipped
    needs: publish-storybook
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ needs.publish-storybook.outputs.url }}
        run: test -z "$URL"

  unpublish-storybook:
    name: unpublish-storybook (no environment settings)
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/unpublish-storybook.yml
    with:
      environment: storybook-test
      preview-name: pr-0

  terraform:
    name: Validate the Terraform modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - working-directory: terraform/cloudflare-storybook/examples/basic
        run: terraform init -backend=false -input=false -lockfile=readonly
      - working-directory: terraform/cloudflare-storybook/examples/basic
        run: terraform validate

  # This repository's own formatting and lint, through its own template.
  verify:
    name: verify (this repository)
    uses: ./.github/workflows/ci-verify.yml

  # The one check main's ruleset requires, so adding or renaming a job never means changing the ruleset.
  tests-pass:
    name: Tests pass
    if: always()
    needs:
      [lint, setup, ci-verify, publish-storybook, publish-storybook-skipped, unpublish-storybook, terraform, verify]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every test passed."
