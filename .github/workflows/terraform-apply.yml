name: Terraform apply

# Applies a Terraform project in the GitHub environment the caller names, such as from main after a merge: it plans
# against the state in R2 and applies that plan. Credentials can come from the environment or be passed by the caller.
# The environment's branch rules decide what can apply, and its required reviewers approve before anything runs.
# Until credentials and the environment's TF_APPLY_ENABLED variable are available, the apply skips with a notice.
# github/README.md shows a caller.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment that gates the apply, such as infrastructure.
        type: string
        required: true
      working-directory:
        description: The Terraform project's directory, relative to the repository's root, such as infra.
        type: string
        required: true
      terraform-version:
        description: The Terraform version to run, which the project's required_version should allow.
        type: string
        default: 1.16.6
      state-bucket:
        description: The R2 bucket the project's state is in. The project's s3 backend block sets the key.
        type: string
        required: true
      state-endpoint:
        description: R2's S3 endpoint for the bucket's account, https://<account id>.r2.cloudflarestorage.com.
        type: string
        required: true
      backend-config:
        description: More settings for the backend, as key=value, one per line, given to terraform init.
        type: string
        default: ""
      show-plan:
        description: Print the plan and what the apply did in the run's log. Terraform hides values marked sensitive.
        type: boolean
        default: true
    secrets:
      TF_STATE_ACCESS_KEY_ID:
        description: R2 state bucket access key. An environment secret with this name takes precedence.
        required: false
      TF_STATE_SECRET_ACCESS_KEY:
        description: R2 state bucket secret key.
        required: false
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare provider token, when the project uses it.
        required: false
      TF_GITHUB_TOKEN:
        description: Token with Environments read for the readiness lookup, plus provider permissions when needed.
        required: false
      NEON_API_KEY:
        description: Neon provider key, when the project uses it.
        required: false
    outputs:
      result:
        description: applied, no-changes, or skipped when credentials or the environment enablement marker are absent.
        value: ${{ jobs.apply.outputs.result }}

permissions:
  contents: read

jobs:
  apply:
    name: Apply ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    permissions:
      contents: read
    # Applies to one project queue rather than cancel, and a newer push replaces one still waiting, so the last push's
    # configuration is what's applied, one apply at a time.
    concurrency:
      group: terraform-apply-${{ inputs.working-directory }}
      cancel-in-progress: false
    outputs:
      result: ${{ steps.apply.outputs.result || steps.plan.outputs.result || steps.ready.outputs.result }}
    # An explicit bash runs with pipefail.
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      # Environment secrets override named caller secrets. Both routes still wait for the environment's protection.
      - id: ready
        name: Check for state credentials
        working-directory: .
        env:
          HAS_STATE_CREDENTIALS: ${{ secrets.TF_STATE_ACCESS_KEY_ID != '' && secrets.TF_STATE_SECRET_ACCESS_KEY != '' }}
          GH_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # The merged vars context also includes organization/repository values. Read the selected environment
          # directly, so a marker at either of those broader scopes cannot enable an unconfigured environment.
          APPLY_ENABLED=
          if [ "$HAS_STATE_CREDENTIALS" = true ] && [ -n "$GH_TOKEN" ]; then
            encoded=$(jq -rn --arg name "$ENVIRONMENT" '$name | @uri')
            APPLY_ENABLED=$(gh api "repos/$GITHUB_REPOSITORY/environments/$encoded/variables/TF_APPLY_ENABLED" --jq '.value' 2>/dev/null) || APPLY_ENABLED=
          fi
          if [ "$APPLY_ENABLED" != true ]; then
            echo "::notice::Skipped: configure the $ENVIRONMENT environment's protection, set its TF_APPLY_ENABLED variable to true, and grant the GitHub token Environments read access before applying."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_STATE_CREDENTIALS" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: no TF_STATE_ACCESS_KEY_ID and TF_STATE_SECRET_ACCESS_KEY are available for $ENVIRONMENT, so nothing was applied."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.ready.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Initialize
        if: steps.ready.outputs.ready == 'true'
        env:
          STATE_BUCKET: ${{ inputs.state-bucket }}
          STATE_ENDPOINT: ${{ inputs.state-endpoint }}
          BACKEND_CONFIG: ${{ inputs.backend-config }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
        run: |
          args=(-input=false -lockfile=readonly)
          args+=("-backend-config=bucket=$STATE_BUCKET" "-backend-config=endpoints={s3=\"$STATE_ENDPOINT\"}")
          while IFS= read -r line; do
            if [ -n "$line" ]; then args+=("-backend-config=$line"); fi
          done <<< "$BACKEND_CONFIG"
          terraform init "${args[@]}"

      # The plan is made here, from this commit, and applied in the next step: the one a pull request reviewed was made
      # from its branch, which main may have moved past. Terraform refuses it if the state changes in between. The
      # summary has addresses and actions only, since a plan's values can be secret.
      - id: plan
        name: Plan
        if: steps.ready.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          SHOW_PLAN: ${{ inputs.show-plan }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          plan="$RUNNER_TEMP/terraform.tfplan"
          code=0
          if [ "$SHOW_PLAN" = true ]; then
            terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out="$plan" || code=$?
          else
            terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out="$plan" > /dev/null || code=$?
          fi
          case "$code" in
            0) result=no-changes ;;
            2) result=changes ;;
            *) exit "$code" ;;
          esac

          {
            echo "### Terraform apply for \`$WORKING_DIRECTORY\` in $ENVIRONMENT"
            echo
            terraform show -json "$plan" | jq -r --argjson limit 100 '
              def words:
                .change.actions as $actions
                | [ if .change.importing != null then "import" else empty end,
                    if .previous_address != null then "move" else empty end,
                    if $actions == ["create"] then "create"
                    elif $actions == ["update"] then "update"
                    elif $actions == ["delete"] then "destroy"
                    elif ($actions | sort) == ["create", "delete"] then "replace"
                    elif $actions == ["read"] then "read"
                    elif $actions == ["forget"] then "forget"
                    else empty end ];
              def sign:
                if index("replace") then "-/+" elif index("destroy") then "-" elif index("create") then "+"
                elif index("read") then "<=" else "~" end;
              def pad($width): . + (" " * ([$width - length, 1] | max));
              def count(f): map(select(f)) | length;
              def line: "\(.words | sign | pad(4))\(.words | join(", ") | pad(16))\(.address)"
                + if .from then " (from \(.from))" else "" end;
              [.resource_changes[]? | .change] as $all
              | [.resource_changes[]? | {address, from: .previous_address, words: words} | select(.words != [])]
                as $changes
              | [.output_changes // {} | to_entries[] | select(.value.actions != ["no-op"]) | .key] as $outputs
              | if $changes == [] and $outputs == [] then
                  "**No changes.** The infrastructure matches the configuration."
                else
                  ( [ ($all | count(.importing != null)) as $n | if $n > 0 then "\($n) to import" else empty end,
                      "\($all | count(.actions | index("create"))) to add",
                      "\($all | count(.actions == ["update"])) to change",
                      "\($all | count(.actions | index("delete"))) to destroy",
                      ($all | count(.actions == ["forget"])) as $n | if $n > 0 then "\($n) to forget" else empty end
                    ] | "**Plan:** \(join(", "))." ),
                  if $changes != [] then
                    "",
                    "```diff",
                    ($changes[:$limit][] | line),
                    ($changes | length) as $n | if $n > $limit then "... and \($n - $limit) more" else empty end,
                    "```"
                  else empty end,
                  if $outputs != [] then "", "Outputs that change: \($outputs | map("`\(.)`") | join(", "))."
                  else empty end
                end'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - id: apply
        name: Apply
        if: steps.plan.outputs.result == 'changes'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          SHOW_PLAN: ${{ inputs.show-plan }}
        run: |
          if [ "$SHOW_PLAN" = true ]; then
            terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan"
          else
            terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/terraform.tfplan" > /dev/null
          fi
          printf '\nApplied.\n' >> "$GITHUB_STEP_SUMMARY"
          echo "result=applied" >> "$GITHUB_OUTPUT"
