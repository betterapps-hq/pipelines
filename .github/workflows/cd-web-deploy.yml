name: Deploy a web app

# Deploys a web app to the GitHub environment the caller names, such as staging: it builds, runs the caller's
# migrations and seed, then deploys with Wrangler or the caller's deploy command. The environment's settings, which the
# cloudflare-web Terraform module writes, say where; until they exist it skips with a notice. cd-web-promote deploys
# what one environment has to the next. github/README.md shows a caller.
on:
  workflow_call:
    inputs:
      environment:
        description: The GitHub environment to deploy to, such as staging or production.
        type: string
        required: true
      ref:
        description: >-
          The commit to deploy. Empty is the one that started the run, which is skipped if its branch has moved past it.
        type: string
        default: ""
      working-directory:
        description: The workspace's root, relative to the repository's. The commands run here.
        type: string
        default: .
      app-directory:
        description: Where Wrangler runs and finds the Worker's config, relative to the working directory.
        type: string
        default: .
      build-command:
        description: What builds the app for the environment, run in the working directory. Empty skips the build.
        type: string
        default: pnpm build
      migrate-command:
        description: What migrates the environment's database, run in the working directory before the deploy.
        type: string
        default: ""
      seed-command:
        description: What seeds the environment's database after its migrations, run in the working directory.
        type: string
        default: ""
      deploy-command:
        description: >-
          What deploys instead of Wrangler, run in the working directory. It can report the URL by appending url=<url>
          to $GITHUB_OUTPUT; WEB_URL wins over it.
        type: string
        default: ""
      toolchain:
        description: vite-plus, pnpm, or auto, as the setup action takes it.
        type: string
        default: auto
    outputs:
      url:
        description: The environment's URL; empty when the deploy was skipped.
        value: ${{ jobs.deploy.outputs.url }}
      commit:
        description: The commit deployed; empty when the deploy was skipped.
        value: ${{ jobs.deploy.outputs.commit }}
      version-id:
        description: The Worker version Wrangler deployed; empty for a deploy command.
        value: ${{ jobs.deploy.outputs.version-id }}

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.148.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub records a deployment of the run's commit for this job. Its URL is set only once that commit has deployed,
    # which is how cd-web-promote tells a deploy it can promote from a skip, or from a deploy of another ref.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deployed.outputs.environment-url }}
    permissions:
      contents: read
    # Deploys to one environment, promotions included, run one at a time and are never cancelled midway. A newer one
    # waiting replaces an older one waiting.
    concurrency:
      group: cd-web-${{ inputs.environment }}-${{ inputs.working-directory }}-${{ inputs.app-directory }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.deployed.outputs.url }}
      commit: ${{ steps.deployed.outputs.commit }}
      version-id: ${{ steps.wrangler.outputs.version-id }}
    # An explicit bash runs with pipefail, so a command's own failure isn't hidden behind a pipe.
    defaults:
      run:
        shell: bash
    steps:
      # The environment's settings come from Terraform; until they exist there's nowhere to deploy.
      - id: ready
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.WEB_CLOUDFLARE_API_TOKEN != '' }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=()
          [ -n "$ACCOUNT" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ "$HAS_TOKEN" = true ] || missing+=(WEB_CLOUDFLARE_API_TOKEN)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::notice::Skipped: the $ENVIRONMENT environment has no ${missing[*]} yet. The cloudflare-web Terraform module writes them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rerun of an older push, or one that waited behind a newer, would put older code back.
          if [ -z "$REF" ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
            if [ "$latest" != "$GITHUB_SHA" ]; then
              echo "::notice::Skipped: $GITHUB_REF_NAME has moved on to ${latest::7}, whose run deploys it."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.ready == 'true'
        uses: betterapps-hq/pipelines/github/actions/setup@0b0ed2e646a72e6db61a303cee36127aa5e17a48 # v1.3.1
        with:
          ref: ${{ inputs.ref }}
          working-directory: ${{ inputs.working-directory }}
          toolchain: ${{ inputs.toolchain }}

      # WEB_COMMAND_ENV and WEB_COMMAND_SECRETS are JSON objects of anything else the commands need, such as a build's
      # public settings or a migration's database URL. Each entry is an environment variable for the steps after this
      # one, a secret's masked first.
      - if: steps.ready.outputs.ready == 'true'
        name: Give the commands the environment's settings
        env:
          COMMAND_ENV: ${{ vars.WEB_COMMAND_ENV }}
          COMMAND_SECRETS: ${{ secrets.WEB_COMMAND_SECRETS }}
        run: |
          for setting in COMMAND_ENV COMMAND_SECRETS; do
            json=${!setting}
            [ -n "$json" ] || continue
            if ! jq -e 'type == "object" and all(.[]; type == "string")' <<< "$json" > /dev/null 2>&1; then
              echo "::error::WEB_$setting isn't a JSON object of strings."
              exit 1
            fi
            while IFS= read -r key; do
              if ! [[ "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::WEB_$setting has a key that isn't an environment variable's name."
                exit 1
              fi
              value=$(jq -r --arg key "$key" '.[$key]' <<< "$json")
              if [ "$setting" = COMMAND_SECRETS ]; then
                while IFS= read -r line; do
                  [ -z "$line" ] || echo "::add-mask::$line"
                done <<< "$value"
              fi
              delimiter="EOF_$(openssl rand -hex 16)"
              printf '%s<<%s\n%s\n%s\n' "$key" "$delimiter" "$value" "$delimiter" >> "$GITHUB_ENV"
            done < <(jq -r 'keys[]' <<< "$json")
          done

      - if: steps.ready.outputs.ready == 'true' && inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: eval "$COMMAND"

      # Wrangler checks the Worker bundles and its config is valid before the database changes, so a Worker that can't
      # deploy never migrates it.
      - if: steps.ready.outputs.ready == 'true' && inputs.deploy-command == ''
        working-directory: ${{ inputs.working-directory }}/${{ inputs.app-directory }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run

      # Migrations run before the new code goes out, so they have to work with the code that's running.
      - if: steps.ready.outputs.ready == 'true' && inputs.migrate-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.migrate-command }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: eval "$COMMAND"
      - if: steps.ready.outputs.ready == 'true' && inputs.seed-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.seed-command }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: eval "$COMMAND"

      # WEB_WORKER_SECRETS, a JSON object, is uploaded with each deploy. Wrangler takes it as a file, deleted when the job
      # ends; secrets it doesn't name are kept.
      - if: steps.ready.outputs.ready == 'true'
        id: secrets
        env:
          WORKER_SECRETS: ${{ secrets.WEB_WORKER_SECRETS }}
        run: |
          [ -n "$WORKER_SECRETS" ] || exit 0
          if ! jq -e 'type == "object" and all(.[]; type == "string")' <<< "$WORKER_SECRETS" > /dev/null 2>&1; then
            echo "::error::WEB_WORKER_SECRETS isn't a JSON object of strings."
            exit 1
          fi
          file="$RUNNER_TEMP/worker-secrets.json"
          (umask 077 && printf '%s' "$WORKER_SECRETS" > "$file")
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.ready == 'true' && inputs.deploy-command == ''
        id: wrangler
        working-directory: ${{ inputs.working-directory }}/${{ inputs.app-directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.secrets.outputs.file }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          args=(deploy)
          [ -z "$SECRETS_FILE" ] || args+=(--secrets-file "$SECRETS_FILE")
          npx --yes "wrangler@$WRANGLER_VERSION" "${args[@]}"
          deployed=$(jq -c 'select(.type == "deploy")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          {
            echo "version-id=$(jq -r '.version_id // empty' <<< "$deployed")"
            echo "url=$(jq -r 'first(.targets[]? | select(startswith("https://"))) // empty' <<< "$deployed")"
          } >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.ready == 'true' && inputs.deploy-command != ''
        id: custom
        working-directory: ${{ inputs.working-directory }}
        env:
          COMMAND: ${{ inputs.deploy-command }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.WEB_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEB_WORKER: ${{ vars.WEB_WORKER }}
          WORKER_SECRETS_FILE: ${{ steps.secrets.outputs.file }}
        run: eval "$COMMAND"

      - if: always() && steps.secrets.outputs.file != ''
        env:
          FILE: ${{ steps.secrets.outputs.file }}
        run: rm -f "$FILE"

      - if: steps.wrangler.outcome == 'success' || steps.custom.outcome == 'success'
        id: deployed
        env:
          ENVIRONMENT_URL: ${{ vars.WEB_URL }}
          REPORTED_URL: ${{ steps.wrangler.outputs.url || steps.custom.outputs.url }}
        run: |
          url=${ENVIRONMENT_URL:-$REPORTED_URL}
          commit=$(git rev-parse HEAD)
          if [ -z "$url" ]; then
            echo "::warning::The deploy has no URL, so cd-web-promote can't promote from it. Set WEB_URL, or report one."
          fi
          # A deployment GitHub records as another commit than the one deployed mustn't be promoted.
          if [ "$commit" = "$GITHUB_SHA" ]; then
            echo "environment-url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployed $commit, not the run's $GITHUB_SHA, which GitHub records; cd-web-promote won't promote from this deploy."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Deployed $commit to ${url:-the environment}." >> "$GITHUB_STEP_SUMMARY"
