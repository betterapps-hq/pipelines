name: Verify

# Runs a workspace's verify script on each operating system the caller lists. github/README.md shows a caller.
on:
  workflow_call:
    inputs:
      os:
        description: The runners to verify on, as a JSON array of labels.
        type: string
        default: '["ubuntu-latest"]'
      command:
        description: What verifies the workspace.
        type: string
        default: pnpm verify
      working-directory:
        description: The workspace's root, relative to the repository's.
        type: string
        default: .
      prepare:
        description: Shell commands run after the install and before the command, such as installing test fixtures.
        type: string
        default: ""
      cache-path:
        description: More paths to cache, one per line, such as what prepare installs.
        type: string
        default: ""
      cache-key-files:
        description: A glob of the files whose contents key that cache, such as the fixtures' lockfiles.
        type: string
        default: ""
      fetch-depth:
        description: Commits of history to fetch; 0 fetches all of it, which Beachball's checks need.
        type: number
        default: 1
      toolchain:
        description: vite-plus, pnpm, or auto, as the setup action takes it.
        type: string
        default: auto
      timeout-minutes:
        description: How long each runner gets.
        type: number
        default: 30
      cancel-in-progress:
        description: Cancel a run still going when a newer push to the same branch or pull request starts one.
        type: boolean
        default: true
      concurrency-key:
        description: >-
          What runs are grouped by, in place of the branch or pull request: such as the run's ID, so runs on main never
          wait on or cancel each other, or a name that keeps two calls in one workflow apart.
        type: string
        default: ""
      env:
        description: >-
          Environment variables for every step, the install included, as NAME=value lines, such as a registry that
          overrides .npmrc. Not for secrets, and not NODE_OPTIONS, which GitHub won't set this way.
        type: string
        default: ""
      node-options:
        description: NODE_OPTIONS for every step, such as --max-old-space-size=8192.
        type: string
        default: ""
      vite-task-cache:
        description: >-
          Keep Vite+'s task cache between runs, restored from the newest one. Only tasks run with vp run use it.
        type: boolean
        default: false
    secrets:
      TURBO_TOKEN:
        description:
          Turborepo's remote cache token, for prepare and the command. TURBO_API and TURBO_TEAM go through env.
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        description: The key Turborepo signs and checks remote cache artifacts with, when the cache requires it.
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # One group per runner, so the matrix's runs don't cancel each other.
    concurrency:
      group:
        ci-verify-${{ github.workflow }}-${{ inputs.concurrency-key || github.ref }}-${{ inputs.working-directory }}-${{
        matrix.os }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    # GitHub won't take NODE_OPTIONS through GITHUB_ENV, so it's set for the job instead. Empty is the same as unset.
    env:
      NODE_OPTIONS: ${{ inputs.node-options }}
    steps:
      # Before checking out, so the install sees them; the working directory doesn't exist yet.
      - if: inputs.env != ''
        working-directory: .
        env:
          LINES: ${{ inputs.env }}
        run: |
          while IFS= read -r line; do
            [ -z "${line//[[:space:]]/}" ] && continue
            if [[ "$line" != *=* || "${line%%=*}" =~ [^A-Za-z0-9_] ]]; then
              echo "::error::env takes NAME=value lines; this one isn't: ${line%%=*}"
              exit 1
            fi
            if [ "${line%%=*}" = NODE_OPTIONS ]; then
              echo "::error::GitHub won't set NODE_OPTIONS through env; pass it as node-options."
              exit 1
            fi
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$LINES"

      # A reusable workflow's ./ is the caller's repository, so it names its own actions in full, pinned to a release's
      # commit, which Dependabot moves.
      - uses: betterapps-hq/pipelines/github/actions/setup@978c87e0f9676edfb85ea5ca735e3cea656c8475 # v1.1.0
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          working-directory: ${{ inputs.working-directory }}
          toolchain: ${{ inputs.toolchain }}
      - if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ci-verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-key-files) }}
      # Saved under this run and restored from the newest, so it moves on with every run instead of being kept once.
      - if: inputs.vite-task-cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules/.vite/task-cache
          key:
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-
      # Turborepo's secrets reach only these two steps, never the install and its scripts. One that isn't passed is
      # unset rather than empty, which Turborepo would try to use.
      - if: inputs.prepare != ''
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          for name in TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY; do [ -n "${!name}" ] || unset "$name"; done
          ${{ inputs.prepare }}
      - env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          for name in TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY; do [ -n "${!name}" ] || unset "$name"; done
          ${{ inputs.command }}
      - if: inputs.vite-task-cache && success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
