name: Verify

# Runs a workspace's verify script on each operating system the caller lists, and can hand what it builds to a later job
# as an artifact. github/README.md shows a caller.
on:
  workflow_call:
    outputs:
      artifact-name:
        description:
          The name of the artifact artifact-path uploaded, for actions/download-artifact. Empty when none was.
        value: ${{ jobs.verify.outputs.artifact-name }}
    inputs:
      os:
        description: The runners to verify on, as a JSON array of labels.
        type: string
        default: '["ubuntu-latest"]'
      command:
        description: What verifies the workspace.
        type: string
        default: pnpm verify
      working-directory:
        description: The workspace's root, relative to the repository's.
        type: string
        default: .
      prepare:
        description: Shell commands run after the install and before the command, such as installing test fixtures.
        type: string
        default: ""
      cache-path:
        description: More paths to cache, one per line, such as what prepare installs.
        type: string
        default: ""
      cache-key-files:
        description: A glob of the files whose contents key that cache, such as the fixtures' lockfiles.
        type: string
        default: ""
      fetch-depth:
        description: Commits of history to fetch; 0 fetches all of it, which Beachball's checks need.
        type: number
        default: 1
      lfs:
        description: Fetch the repository's Git LFS objects after checking out, cached until they change.
        type: boolean
        default: false
      toolchain:
        description: vite-plus, pnpm, or auto, as the setup action takes it.
        type: string
        default: auto
      timeout-minutes:
        description: How long each runner gets.
        type: number
        default: 30
      cancel-in-progress:
        description: Cancel a run still going when a newer push to the same branch or pull request starts one.
        type: boolean
        default: true
      concurrency-key:
        description: >-
          What runs are grouped by, in place of the branch or pull request: such as the run's ID, so runs on main never
          wait on or cancel each other, or a name that keeps two calls in one workflow apart.
        type: string
        default: ""
      env:
        description: >-
          Environment variables for every step, the install included, as NAME=value lines, such as a registry that
          overrides .npmrc. Not for secrets, and not NODE_OPTIONS, which GitHub won't set this way.
        type: string
        default: ""
      node-options:
        description: NODE_OPTIONS for prepare and the command, such as --max-old-space-size=8192.
        type: string
        default: ""
      vite-task-cache:
        description: >-
          Keep Vite+'s task cache between runs, restored from the newest one. Only tasks run with vp run use it.
        type: boolean
        default: false
      vite-task-cache-key:
        description: >-
          What tells this call's task caches from another's on the same system and workspace, such as two calls in one
          workflow that run different tasks. Each job is named verify inside this workflow, so it can't tell itself.
        type: string
        default: verify
      artifact-path:
        description: >-
          Paths to upload as an artifact once the command passes, one per line, relative to the repository, such as a
          build a later job deploys. Nothing is uploaded when it's empty.
        type: string
        default: ""
      artifact-name:
        description: >-
          The artifact's name. Two calls in one workflow that each upload one need names of their own, as a second
          upload under a name replaces the first.
        type: string
        default: build
      artifact-os:
        description: The runner in os that uploads the artifact, as only one can. Empty for the first in os.
        type: string
        default: ""
      artifact-retention-days:
        description: Days the artifact is kept; 0 for the repository's setting.
        type: number
        default: 0
    secrets:
      TURBO_TOKEN:
        description:
          Turborepo's remote cache token, for prepare and the command. TURBO_API and TURBO_TEAM go through env.
        required: false
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        description: The key Turborepo signs and checks remote cache artifacts with, when the cache requires it.
        required: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Only the runner that uploads sets it, and an empty output doesn't replace another runner's, so it's well-defined.
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-id && inputs.artifact-name || '' }}
    # One group per runner, so the matrix's runs don't cancel each other.
    concurrency:
      group:
        ci-verify-${{ github.workflow }}-${{ inputs.concurrency-key || github.ref }}-${{ inputs.working-directory }}-${{
        matrix.os }}
      cancel-in-progress: ${{ inputs.cancel-in-progress }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Otherwise no runner would upload, and a later job would find nothing to download.
      - if: inputs.artifact-path != '' && inputs.artifact-os != '' && !contains(fromJSON(inputs.os), inputs.artifact-os)
        working-directory: .
        env:
          ARTIFACT_OS: ${{ inputs.artifact-os }}
        run: |
          echo "::error::artifact-os has to be one of os, and $ARTIFACT_OS isn't."
          exit 1

      # Before checking out, so the install sees them; the working directory doesn't exist yet.
      - if: inputs.env != ''
        working-directory: .
        env:
          LINES: ${{ inputs.env }}
        run: |
          while IFS= read -r line; do
            [ -z "${line//[[:space:]]/}" ] && continue
            if [[ "$line" != *=* || "${line%%=*}" =~ [^A-Za-z0-9_] ]]; then
              echo "::error::env takes NAME=value lines; this one isn't: ${line%%=*}"
              exit 1
            fi
            if [ "${line%%=*}" = NODE_OPTIONS ]; then
              echo "::error::GitHub won't set NODE_OPTIONS through env; pass it as node-options."
              exit 1
            fi
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$LINES"

      # A reusable workflow's ./ is the caller's repository, so it names its own actions in full, pinned to a release's
      # commit, which Dependabot moves.
      - uses: betterapps-hq/pipelines/github/actions/setup@0b0ed2e646a72e6db61a303cee36127aa5e17a48 # v1.3.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          lfs: ${{ inputs.lfs }}
          working-directory: ${{ inputs.working-directory }}
          toolchain: ${{ inputs.toolchain }}
      - if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-path }}
          key: ci-verify-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-key-files) }}
      # Restored from the newest cache for this key, then saved under this run when every step passes.
      - if: inputs.vite-task-cache
        uses: betterapps-hq/pipelines/github/actions/vite-task-cache@5bcd824813220f0b3a6bafa3b6a809725a5b686d # v1.5.0
        with:
          working-directory: ${{ inputs.working-directory }}
          key: ${{ inputs.vite-task-cache-key }}
      # The caller's scripts come through env and run in this shell. Only they get Turborepo's secrets, never the
      # install and its scripts, and NODE_OPTIONS, which would also reach the actions above; GitHub won't take it through
      # GITHUB_ENV anyway. Each one that's empty is unset, since Turborepo would try to use an empty token.
      - if: inputs.prepare != ''
        env:
          CI_VERIFY_SCRIPT: ${{ inputs.prepare }}
          NODE_OPTIONS: ${{ inputs.node-options }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          for name in NODE_OPTIONS TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY; do [ -n "${!name}" ] || unset "$name"; done
          eval "$CI_VERIFY_SCRIPT"
      - env:
          CI_VERIFY_SCRIPT: ${{ inputs.command }}
          NODE_OPTIONS: ${{ inputs.node-options }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
        run: |
          for name in NODE_OPTIONS TURBO_TOKEN TURBO_REMOTE_CACHE_SIGNATURE_KEY; do [ -n "${!name}" ] || unset "$name"; done
          eval "$CI_VERIFY_SCRIPT"

      # From one runner, as two uploads under one name would collide; the paths are relative to the repository, as
      # upload-artifact takes them. overwrite lets a re-run replace what its earlier attempt uploaded.
      - id: upload
        if: inputs.artifact-path != '' && matrix.os == (inputs.artifact-os || fromJSON(inputs.os)[0])
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
          overwrite: true
