version: 2
updates:
  # The actions the templates use, pinned by commit with the version in a comment.
  - package-ecosystem: github-actions
    directories: ["/", "/github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # Templates name this repository's own actions at the release they ship in, which a release moves.
    ignore:
      - dependency-name: Fencing-Club/pipelines
